name: Check

on:
  workflow_call:

jobs:
  check-pr-title:      
    runs-on: ubuntu-latest
    steps:
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Validate PR title
        uses: deepakputhraya/action-pr-title@v1.0.2
        with:
          regex: ^(build|ci|docs|feat|fix|perf|refactor|test)(\(.*?\))?:\ .*$
